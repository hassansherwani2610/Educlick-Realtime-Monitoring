spring.application.name=click-monitoring-service

# ======================
# SERVER
# ======================
server.port=8080

# ======================
# DATABASE (MYSQL)
# ======================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/educlick}
spring.datasource.username=${DB_USERNAME:educlick_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ======================
# KAFKA
# ======================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=click-group
spring.kafka.consumer.auto-offset-reset=earliest

# ======================
# ACTUATOR & PROMETHEUS
# ======================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ======================
# CUSTOM APP CONFIG
# ======================
app.kafka.topic=course-clicks

# ======================
# LOGGING
# ======================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.kafka=DEBUG